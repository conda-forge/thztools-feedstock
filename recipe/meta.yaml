{% set name = "thztools" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/thztools-{{ version }}.tar.gz
  sha256: ce63f5ed44cde7c9ac151a4067e60a840eff22214cf0f7a15befba8e60c2e50b

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.21
    - scipy
    - numdifftools

test:
  imports:
    - thztools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/thztools/
  summary: Data analysis software tools for terahertz time-domain spectroscopy (THz-TDS)
  dev_url: https://github.com/dodge-research-group/thztools
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jsdodge
