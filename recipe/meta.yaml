{% set name = "thztools" %}
{% set version = "0.6.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/thztools-{{ version }}.tar.gz
  sha256: eeac6c37b35a821bfca3e36631273b4677a3d5540ed9d3276a12032564c37dc5

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy >=1.21
    - scipy
    - numdifftools

test:
  imports:
    - thztools
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://pypi.org/project/thztools/
  summary: Data analysis software tools for terahertz time-domain spectroscopy (THz-TDS)
  dev_url: https://github.com/dodge-research-group/thztools
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jsdodge
